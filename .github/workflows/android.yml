name: Build Android APK

# Bina APK secara automatik dan terbitkan ke GitHub Releases.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Sediakan kunci tandatangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cloudpix.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/cloudpix.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 tiada — APK ditandatangan dengan kunci debug"
          fi

      - name: Bina APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CLOUDPIX_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          CLOUDPIX_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/CloudPix-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CloudPix-APK
          path: out/*.apk

      - name: Terbit ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CloudPix v1.0.${{ github.run_number }}
          body: |
            APK Android CloudPix. Muat turun fail .apk di bawah dan pasang pada telefon.
            Kali pertama buka: masukkan Project URL & Publishable key Supabase (jika belum diset dalam build).
          files: out/*.apk
          make_latest: true
